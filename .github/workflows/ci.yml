name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run unit/integration tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  backend-postgres:
    name: Backend - smoke test on PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aas
          POSTGRES_USER: aas
          POSTGRES_PASSWORD: aas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: app
      - name: Start app with prod profile and run Flyway migrations
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/aas
          DB_USER: aas
          DB_PASSWORD: aas
        run: |
          JAR=$(ls app/*.jar | grep -v plain | head -1)
          nohup java -jar "$JAR" > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health; then echo; echo "App is healthy"; exit 0; fi
            sleep 2
          done
          cat app.log; exit 1

  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  release-bundle:
    name: Package release bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend-postgres, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: bundle/backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: bundle/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: aas-release-${{ github.sha }}
          path: bundle
